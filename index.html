<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - Afnan AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Noto Sans Arabic', sans-serif; background: #f0f9ff; }</style>
</head>
<body class="flex items-center justify-center min-h-screen">

    <div class="w-full max-w-md p-8 bg-white/80 backdrop-blur-xl rounded-[40px] shadow-2xl text-center border border-white">
        <div class="w-24 h-24 bg-blue-500 rounded-full mx-auto mb-6 flex items-center justify-center shadow-lg shadow-blue-500/30">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1" />
            </svg>
        </div>
        <h1 class="text-3xl font-black text-gray-800 mb-2">مرحباً بك</h1>
        <p class="text-gray-500 mb-8 font-medium">سجل دخولك للوصول إلى عالمك</p>

        <button onclick="signInWithGoogle()" class="w-full p-4 bg-gray-900 text-white rounded-2xl font-bold flex items-center justify-center gap-3 hover:scale-[1.02] transition shadow-xl">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" class="w-6 h-6">
            تسجيل الدخول بواسطة Google
        </button>
        
        <div id="loader" class="hidden mt-6">
            <div class="w-6 h-6 border-2 border-blue-500 border-t-transparent rounded-full animate-spin mx-auto"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        // إعدادات Firebase الخاصة بك
        const firebaseConfig = {
            apiKey: "AIzaSyBnmqWRY6lV54meFvO89QeXwtd28w81FcY",
            authDomain: "rtx3090-28439.firebaseapp.com",
            projectId: "rtx3090-28439",
            storageBucket: "rtx3090-28439.firebasestorage.app",
            messagingSenderId: "178612030690",
            appId: "1:178612030690:web:883189ced2ed3a78e3e2bb"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // مراقب حالة الدخول
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // إذا كان مسجلاً، اذهب للرئيسية فوراً
                window.location.href = "home.html";
            }
        });

        window.signInWithGoogle = async () => {
            document.getElementById('loader').classList.remove('hidden');
            const provider = new GoogleAuthProvider();
            try {
                await signInWithPopup(auth, provider);
                // التوجيه سيتم تلقائياً عبر onAuthStateChanged
            } catch (error) {
                console.error("Login Failed:", error);
                alert("فشل تسجيل الدخول: " + error.message);
                document.getElementById('loader').classList.add('hidden');
            }
        };
    </script>
</body>
</html>
