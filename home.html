<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الصفحة الرئيسية</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <div class="menu-toggle" onclick="toggleSidebar()">
        <i class="fas fa-bars"></i>
    </div>

    <div id="sidebar" class="sidebar">
        <a href="javascript:void(0)" onclick="toggleSidebar()" style="position: absolute; left: 20px; top: 20px; font-size: 24px; text-decoration: none; color: #333;">&times;</a>

        <div class="profile-section">
            <div class="avatar-container">
                <img id="sidebar-avatar" src="default-avatar.png" class="user-avatar">
                <img id="sidebar-frame" src="" class="user-frame" style="display: none;">
            </div>
            <h3 id="sidebar-name" style="margin: 5px 0;">جاري التحميل...</h3>
            <span id="sidebar-id" style="color: #777; font-size: 14px; background: #eee; padding: 2px 8px; border-radius: 4px;">ID: --</span>
            
            <div style="margin-top: 5px; font-weight: bold; color: #e91e63;">المستوى: <span id="sidebar-level">1</span></div>

            <div id="equipped-badges" class="badges-container">
                </div>
        </div>

        <div class="stats-cards">
            <div class="stat-card">
                <div class="stat-title">الثروة</div>
                <div class="stat-value" style="color: #FFD700;">Wait...</div> </div>
            <div class="stat-card">
                <div class="stat-title">السحر</div>
                <div class="stat-value" style="color: #ff69b4;">Wait...</div> </div>
        </div>

        <button class="nav-btn" onclick="showSection('home-sec')"><i class="fas fa-home"></i> الرئيسية</button>
        <button class="nav-btn" onclick="showSection('wallet-sec')"><i class="fas fa-wallet"></i> المحفظة</button>
        <button class="nav-btn" onclick="showSection('store-sec')"><i class="fas fa-store"></i> المتجر</button>
        <button class="nav-btn" onclick="showSection('my-bag-sec')"><i class="fas fa-briefcase"></i> حقيبتي</button>
        <button class="nav-btn" onclick="showSection('my-badges-sec')"><i class="fas fa-medal"></i> شاراتي</button>
        <button class="nav-btn" onclick="logout()"><i class="fas fa-sign-out-alt" style="color:red;"></i> تسجيل خروج</button>
    </div>

    <div id="main-content">
        <div id="wallet-sec" style="display:none;">
            <h2>💰 المحفظة</h2>
            <div class="stat-card">كوينز: <span id="wallet-coins">0</span></div>
            <div class="stat-card">ماسات: <span id="wallet-diamonds">0</span></div>
        </div>

        <div id="store-sec" style="display:none;">
            <h2>🏪 المتجر</h2>
            <div class="grid-container" id="store-items"></div>
        </div>

        <div id="my-bag-sec" style="display:none;">
            <h2>🎒 حقيبتي (الإطارات والدخلات)</h2>
            <div class="grid-container" id="bag-items"></div>
        </div>

        <div id="my-badges-sec" style="display:none;">
            <h2>🏅 شاراتي</h2>
            <div class="grid-container" id="my-badges-list"></div>
        </div>

        <div id="home-sec">
            <h1>أهلاً بك في التطبيق</h1>
        </div>
    </div>

    <script type="module">
        import { auth, db } from './firebase-config.js';
        import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { doc, onSnapshot, updateDoc, arrayUnion, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // عناصر واجهة المستخدم
        const els = {
            avatar: document.getElementById('sidebar-avatar'),
            frame: document.getElementById('sidebar-frame'),
            name: document.getElementById('sidebar-name'),
            id: document.getElementById('sidebar-id'),
            level: document.getElementById('sidebar-level'),
            badgesDiv: document.getElementById('equipped-badges'),
            coins: document.getElementById('wallet-coins'),
            diamonds: document.getElementById('wallet-diamonds')
        };

        let currentUser = null;

        // بيانات المتجر (يمكن وضعها في Firestore في كوليكشن products)
        // items types: 'frame', 'badge', 'entrance'
        const storeItems = [
            { id: 'f1', name: 'إطار ذهبي', price: 100, type: 'frame', img: 'frame_gold.png' },
            { id: 'f2', name: 'إطار نيون', price: 200, type: 'frame', img: 'frame_neon.png' },
            { id: 'b1', name: 'شارة النسر', price: 50, type: 'badge', img: 'badge_eagle.png' },
            { id: 'b2', name: 'شارة الحب', price: 50, type: 'badge', img: 'badge_love.png' },
            // أضف المزيد هنا
        ];

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                const userRef = doc(db, "users", user.uid);

                // مزامنة البيانات (Realtime)
                onSnapshot(userRef, (docSnap) => {
                    if (docSnap.exists()) {
                        const data = docSnap.data();
                        updateSidebar(data, user);
                        updateWallet(data);
                        renderBag(data.inventory || []);
                        renderMyBadges(data.inventory || []);
                    }
                });
                
                renderStore(); // عرض المتجر
            } else {
                window.location.href = "index.html";
            }
        });

        // تحديث الشريط الجانبي
        function updateSidebar(data, user) {
            els.name.textContent = data.displayName || user.displayName;
            els.id.textContent = "ID: " + (data.customID || user.uid.slice(0,6));
            els.avatar.src = data.photoURL || user.photoURL || 'default.png';
            els.level.textContent = data.level || 1;

            // تحديث الإطار
            if (data.equipped && data.equipped.frame) {
                els.frame.src = data.equipped.frame;
                els.frame.style.display = 'block';
            } else {
                els.frame.style.display = 'none';
            }

            // تحديث الشارات تحت المستوى
            els.badgesDiv.innerHTML = '';
            if (data.equipped && data.equipped.badges) {
                data.equipped.badges.forEach(badgeUrl => {
                    const img = document.createElement('img');
                    img.src = badgeUrl;
                    img.className = 'badge-icon';
                    els.badgesDiv.appendChild(img);
                });
            }
        }

        function updateWallet(data) {
            if (data.wallet) {
                els.coins.textContent = data.wallet.coins || 0;
                els.diamonds.textContent = data.wallet.diamonds || 0;
            }
        }

        // عرض المتجر
        function renderStore() {
            const container = document.getElementById('store-items');
            container.innerHTML = '';
            storeItems.forEach(item => {
                const div = document.createElement('div');
                div.className = 'item-card';
                div.innerHTML = `
                    <img src="${item.img}">
                    <h4>${item.name}</h4>
                    <p>💰 ${item.price}</p>
                    <button class="buy-btn" onclick="buyItem('${item.id}')">شراء</button>
                `;
                container.appendChild(div);
            });
        }

        // عملية الشراء
        window.buyItem = async (itemId) => {
            const item = storeItems.find(i => i.id === itemId);
            const userRef = doc(db, "users", currentUser.uid);
            const snap = await getDoc(userRef);
            const data = snap.data();
            const currentCoins = data.wallet?.coins || 0;

            if (currentCoins >= item.price) {
                // خصم المبلغ وإضافة العنصر
                await updateDoc(userRef, {
                    "wallet.coins": currentCoins - item.price,
                    "inventory": arrayUnion(item.id)
                });
                alert("تم الشراء بنجاح!");
            } else {
                alert("لا يوجد رصيد كافي!");
            }
        };

        // عرض الحقيبة (إطارات ودخلات فقط)
        function renderBag(inventoryIds) {
            const container = document.getElementById('bag-items');
            container.innerHTML = '';
            
            // فلتر العناصر المملوكة والتي ليست شارات
            const myItems = storeItems.filter(item => inventoryIds.includes(item.id) && item.type !== 'badge');

            myItems.forEach(item => {
                const div = document.createElement('div');
                div.className = 'item-card';
                div.innerHTML = `
                    <img src="${item.img}">
                    <h4>${item.name}</h4>
                    <button class="equip-btn" onclick="equipItem('${item.type}', '${item.img}')">تفعيل</button>
                `;
                container.appendChild(div);
            });
        }

        // عرض شاراتي (قسم منفصل للشارات فقط)
        function renderMyBadges(inventoryIds) {
            const container = document.getElementById('my-badges-list');
            container.innerHTML = '';

            const myBadges = storeItems.filter(item => inventoryIds.includes(item.id) && item.type === 'badge');

            myBadges.forEach(item => {
                const div = document.createElement('div');
                div.className = 'item-card';
                div.innerHTML = `
                    <img src="${item.img}">
                    <h4>${item.name}</h4>
                    <button class="equip-btn" onclick="equipBadge('${item.img}')">تفعيل/إلغاء</button>
                `;
                container.appendChild(div);
            });
        }

        // تفعيل الإطار أو الدخلة
        window.equipItem = async (type, imgUrl) => {
            const userRef = doc(db, "users", currentUser.uid);
            if (type === 'frame') {
                await updateDoc(userRef, { "equipped.frame": imgUrl });
            } else if (type === 'entrance') {
                await updateDoc(userRef, { "equipped.entrance": imgUrl });
            }
            alert("تم التفعيل!");
        };

        // تفعيل الشارة (تضاف للمصفوفة)
        window.equipBadge = async (imgUrl) => {
            const userRef = doc(db, "users", currentUser.uid);
            const snap = await getDoc(userRef);
            let currentBadges = snap.data().equipped?.badges || [];

            if (currentBadges.includes(imgUrl)) {
                // إزالة الشارة إذا كانت موجودة
                currentBadges = currentBadges.filter(b => b !== imgUrl);
            } else {
                // إضافة الشارة (بحد أقصى مثلاً 10)
                currentBadges.push(imgUrl);
            }

            await updateDoc(userRef, { "equipped.badges": currentBadges });
        };

        // وظائف الواجهة
        window.toggleSidebar = () => {
            document.getElementById("sidebar").classList.toggle("active");
        };

        window.showSection = (secId) => {
            // إخفاء الكل
            ['home-sec', 'wallet-sec', 'store-sec', 'my-bag-sec', 'my-badges-sec'].forEach(id => {
                document.getElementById(id).style.display = 'none';
            });
            // إظهار المطلوب
            document.getElementById(secId).style.display = 'block';
            toggleSidebar(); // إغلاق القائمة بعد الاختيار
        };

        window.logout = () => {
            signOut(auth);
        };
    </script>
</body>
</html>
