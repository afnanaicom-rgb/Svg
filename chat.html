<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المحادثة - Afnan AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans Arabic', sans-serif; background: #f3f4f6; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .msg-me { background: #1f2937; color: white; border-radius: 18px 18px 4px 18px; }
        .msg-him { background: white; color: #1f2937; border-radius: 18px 18px 18px 4px; border: 1px solid #e5e7eb; }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden bg-gray-100">

    <header class="h-16 bg-white/80 backdrop-blur shadow-sm flex items-center px-4 justify-between shrink-0 z-10">
        <div class="flex items-center gap-3">
            <button onclick="history.back()" class="p-2 hover:bg-gray-100 rounded-full"><i data-lucide="arrow-right"></i></button>
            <div class="flex items-center gap-2">
                <img id="chatHeaderImg" src="" class="w-10 h-10 rounded-full bg-gray-200 object-cover">
                <div>
                    <h3 id="chatHeaderName" class="font-bold text-sm">جاري التحميل...</h3>
                    <p class="text-[10px] text-green-600 font-bold flex items-center gap-1">
                        <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span> متصل
                    </p>
                </div>
            </div>
        </div>
        <button class="p-2 hover:bg-gray-100 rounded-full"><i data-lucide="more-vertical" class="w-5 h-5 text-gray-500"></i></button>
    </header>

    <div id="messagesList" class="flex-1 overflow-y-auto p-4 space-y-3 no-scrollbar flex flex-col">
        </div>

    <div class="p-4 bg-white border-t border-gray-200 shrink-0">
        <div class="flex gap-2 items-center max-w-lg mx-auto">
            <input type="text" id="msgInput" placeholder="اكتب رسالة..." 
                   class="flex-1 bg-gray-100 border-0 rounded-2xl px-4 py-3 focus:ring-2 focus:ring-blue-500 focus:bg-white transition">
            <button onclick="sendMsg()" class="w-12 h-12 bg-blue-600 text-white rounded-2xl flex items-center justify-center hover:bg-blue-700 transition active:scale-95 shadow-lg shadow-blue-500/30">
                <i data-lucide="send" class="w-5 h-5"></i>
            </button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getDatabase, ref, push, onValue, serverTimestamp as rtdbTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBnmqWRY6lV54meFvO89QeXwtd28w81FcY",
            authDomain: "rtx3090-28439.firebaseapp.com",
            projectId: "rtx3090-28439",
            storageBucket: "rtx3090-28439.firebasestorage.app",
            messagingSenderId: "178612030690",
            appId: "1:178612030690:web:883189ced2ed3a78e3e2bb",
            databaseURL: "https://rtx3090-28439-default-rtdb.firebaseio.com/" 
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const rtdb = getDatabase(app);

        let myUid = null;
        let friendUid = null;
        let chatId = null;

        // استخراج معرف الصديق من الرابط
        const urlParams = new URLSearchParams(window.location.search);
        friendUid = urlParams.get('uid');

        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = "index.html";
                return;
            }
            if (!friendUid) {
                alert("خطأ: لم يتم تحديد صديق");
                window.location.href = "home.html";
                return;
            }
            
            myUid = user.uid;
            
            // تحميل بيانات الصديق (الاسم والصورة)
            const friendDoc = await getDoc(doc(db, "users", friendUid));
            if(friendDoc.exists()) {
                const fData = friendDoc.data();
                document.getElementById('chatHeaderName').innerText = fData.displayName;
                document.getElementById('chatHeaderImg').src = fData.photoURL;
            }

            // إنشاء Chat ID موحد (الترتيب الأبجدي يضمن أن الطرفين يدخلان نفس الغرفة)
            chatId = [myUid, friendUid].sort().join("_");
            
            startListening();
        });

        function startListening() {
            const chatRef = ref(rtdb, `chats/${chatId}/messages`);
            const msgList = document.getElementById('messagesList');

            onValue(chatRef, (snapshot) => {
                msgList.innerHTML = ''; // تنظيف للشاشة (يمكن تحسينه للإضافة فقط)
                const data = snapshot.val();
                
                if (data) {
                    Object.values(data).forEach(msg => {
                        const isMe = msg.senderId === myUid;
                        const div = document.createElement('div');
                        div.className = `flex w-full ${isMe ? 'justify-end' : 'justify-start'}`;
                        div.innerHTML = `
                            <div class="px-4 py-2 max-w-[75%] text-sm font-medium shadow-sm ${isMe ? 'msg-me' : 'msg-him'}">
                                ${msg.text}
                            </div>
                        `;
                        msgList.appendChild(div);
                    });
                    // Scroll to bottom
                    msgList.scrollTop = msgList.scrollHeight;
                }
            });
        }

        window.sendMsg = () => {
            const inp = document.getElementById('msgInput');
            const txt = inp.value.trim();
            if(!txt) return;

            const chatRef = ref(rtdb, `chats/${chatId}/messages`);
            push(chatRef, {
                senderId: myUid,
                text: txt,
                timestamp: rtdbTimestamp()
            });
            inp.value = '';
        };
        
        // إرسال بالضغط على Enter
        document.getElementById('msgInput').addEventListener('keypress', (e) => {
            if(e.key === 'Enter') window.sendMsg();
        });

        lucide.createIcons();
    </script>
</body>
</html>
